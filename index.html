<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EbulitionPy - INFINI ♾️</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:20px}
input{padding:15px;width:85%;max-width:480px;border-radius:10px;border:none;font-size:18px}
button{padding:15px 25px;background:#f59e0b;color:white;border:none;border-radius:10px;font-size:18px;cursor:pointer;margin-top:10px;font-weight:bold}
.card{background:white;color:black;padding:25px;border-radius:20px;margin:20px auto;max-width:520px;text-align:center}
.temp{font-size:32px;color:#dc2626;font-weight:bold;margin-top:10px}
.small{color:#666;font-size:13px}
.badge{background:#22c55e;color:white;padding:5px 12px;border-radius:20px;font-size:12px}
.ex{margin-top:20px;font-size:13px;color:#cbd5e1}
.ex span{background:#1e293b;padding:6px 11px;border-radius:20px;margin:3px;display:inline-block;cursor:pointer}
</style>
</head>
<body>
<h1>🌡️ EbulitionPy ♾️</h1>
<p><span class="badge">INFINI - 115 000 000+ Molécules - Français + Anglais</span></p>
<p><b>N'importe quelle molécule !</b></p>
<input id="nom" placeholder="Ex: Carbone, Acide sulfurique, Theobromine..." onkeydown="if(event.key==='Enter') chercher()">
<br><button onclick="chercher()">Chercher 🔍</button>
<div id="resultat"></div>
<div class="ex">
Clique pour tester l'INFINI :<br>
<span onclick="tester('Carbone')">Carbone</span>
<span onclick="tester('Acide sulfurique')">Acide sulfurique 🇫🇷</span>
<span onclick="tester('Sulfuric Acid')">Sulfuric Acid 🇬🇧</span>
<span onclick="tester('Theobromine')">Theobromine ♾️</span>
<span onclick="tester('Morphine')">Morphine ♾️</span>
<span onclick="tester('Penicilline')">Pénicilline ♾️</span>
<span onclick="tester('Cholesterol')">Cholestérol ♾️</span>
</div>
<script>
function net(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,""); }
const base = {};
function add(temp, ...noms){ noms.forEach(n=> base[net(n)] = temp); }
// BASE RAPIDE OFFLINE - 100 plus connus
add("100 °C","eau","water","h2o");
add("78.4 °C","ethanol","éthanol","alcool","alcohol");
add("337 °C","acide sulfurique","sulfuric acid","h2so4");
add("83 °C","acide nitrique","nitric acid","hno3");
add("-85 °C","acide chlorhydrique","hydrochloric acid","hcl");
add("118.1 °C","acide acétique","acetic acid","vinaigre","ch3cooh");
add("3642 °C (Sublimation - devient gaz sans bouillir)","carbone","carbon","c","charbon","graphite","diamant");
add("-78.5 °C (Sublimation)","dioxyde de carbone","carbon dioxide","co2");
add("178 °C (se décompose)","cafeine","caféine","caffeine");
add("140 °C (se décompose)","aspirine","aspirin");
add("169 °C (se décompose)","paracetamol","paracétamol","acetaminophen","doliprane");
add("150 °C (se décompose)","glucose");
add("186 °C (se décompose)","sucre","sucrose","saccharose");
add("1465 °C","sel","sodium chloride","nacl");
add("56 °C","acetone","acétone");
add("80.1 °C","benzene","benzène");
add("-33.3 °C","ammoniaque","ammonia","nh3");
add("-161.5 °C","methane","méthane","ch4");

// DICTIONNAIRE FRANÇAIS -> ANGLAIS POUR L'INFINI
const fr2en = {
"carbone":"carbon","acidesulfurique":"sulfuric acid","acidenitrique":"nitric acid","acidechlorhydrique":"hydrochloric acid",
"acideacetique":"acetic acid","acideformique":"formic acid","acidecitrique":"citric acid","acidelactique":"lactic acid",
"acidebenzoique":"benzoic acid","acidephosphorique":"phosphoric acid","acideascorbique":"ascorbic acid",
"acidesalicylique":"salicylic acid","acidefolique":"folic acid","eau":"water","alcool":"ethanol","vinaigre":"acetic acid",
"sel":"sodium chloride","sucre":"sucrose","cafeine":"caffeine","aspirine":"aspirin","paracetamol":"acetaminophen",
"ammoniaque":"ammonia","benzene":"benzene","methane":"methane","oxygene":"oxygen","azote":"nitrogen",
"hydrogene":"hydrogen","dioxydedecarbone":"carbon dioxide","chlore":"chlorine","soude":"sodium hydroxide",
"glycerol":"glycerol","vanilline":"vanillin","theobromine":"theobromine","nicotine":"nicotine","menthol":"menthol",
"phenol":"phenol","uree":"urea","formol":"formaldehyde","chloroforme":"chloroform","mercure":"mercury",
"fer":"iron","cuivre":"copper","or":"gold","argent":"silver","zinc":"zinc","plomb":"lead",
"ibuprofene":"ibuprofen","vitaminec":"ascorbic acid","penicilline":"penicillin","morphine":"morphine",
"codeine":"codeine","adrenaline":"epinephrine","cholesterol":"cholesterol","lactose":"lactose",
"fructose":"fructose","amidon":"starch","cellulose":"cellulose","acetone":"acetone","toluene":"toluene",
"methanol":"methanol","theobromine":"theobromine","cholesterol":"cholesterol"
};

function tester(nom){ document.getElementById('nom').value = nom; chercher(); }

// Cherche Boiling Point dans TOUT le fichier PubChem
function trouverTemp(obj){
  if(!obj) return null;
  if(typeof obj === 'string'){
    let m = obj.match(/-?\d+(\.\d+)?\s?°C/);
    return m ? m[0] : null;
  }
  if(Array.isArray(obj)){ for(let v of obj){ let r = trouverTemp(v); if(r) return r; } return null; }
  if(typeof obj === 'object'){
    if(obj.TOCHeading && obj.TOCHeading.toLowerCase().includes("boiling")){
      try{ return obj.Information[0].Value.StringWithMarkup[0].String; }catch(e){}
      let r = trouverTemp(obj.Information); if(r) return r;
    }
    for(let k in obj){ let r = trouverTemp(obj[k]); if(r && k!=="TOCHeading") return r; }
  }
  return null;
}

async function essayerPubChem(nom){
  // Essaie direct, puis avec proxy si PubChem bloqué à l'école
  let urls = [
    `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${encodeURIComponent(nom)}/property/CID/JSON`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${encodeURIComponent(nom)}/property/CID/JSON`)}`
  ];
  let cid = null;
  for(let u of urls){
    try{
      let r = await fetch(u); if(!r.ok) continue;
      let d = await r.json(); cid = d.PropertyTable.Properties[0].CID; break;
    }catch(e){ continue; }
  }
  if(!cid) return null;
  let urls2 = [
    `https://pubchem.ncbi.nlm.nih.gov/rest/pug_view/data/compound/${cid}/JSON?heading=Boiling+Point`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://pubchem.ncbi.nlm.nih.gov/rest/pug_view/data/compound/${cid}/JSON?heading=Boiling+Point`)}`
  ];
  for(let u of urls2){
    try{
      let r = await fetch(u); if(!r.ok) continue;
      let d = await r.json(); let t = trouverTemp(d.Record);
      if(t) return {temp:t, cid:cid};
      return {temp:"Pas de point d'ébullition - Elle se décompose / se sublime avant de bouillir", cid:cid};
    }catch(e){ continue; }
  }
  return null;
}

async function chercher(){
  let nomOrig = document.getElementById('nom').value.trim();
  if(!nomOrig) return alert('Écris un nom !');
  document.getElementById('resultat').innerHTML = '⏳ Je cherche dans 115 millions de molécules...';
  let cle = net(nomOrig);
  if(base[cle]){
    document.getElementById('resultat').innerHTML = `<div class="card"><h2>✅ ${nomOrig}</h2><p>La température d'ébullition est de :</p><div class="temp">🌡️ ${base[cle]}</div><p class="small">Source : EbulitionPy ♾️</p></div>`;
    return;
  }
  let nomAng = fr2en[cle] || nomOrig;
  let essais = [...new Set([nomOrig, nomAng])];
  for(let essai of essais){
    try{
      let r = await essayerPubChem(essai);
      if(r){
        document.getElementById('resultat').innerHTML = `<div class="card"><h2>✅ ${nomOrig}</h2><p>La température d'ébullition est de :</p><div class="temp">🌡️ ${r.temp}</div><p class="small">Source : PubChem ♾️ - N° ${r.cid} | Cherché : ${essai}</p></div>`;
        return;
      }
    }catch(e){ continue; }
  }
  document.getElementById('resultat').innerHTML = `<p>❌ Molécule introuvable.<br>Essaie : Carbone, Acide sulfurique, Theobromine, Morphine<br>Vérifie l'orthographe, en Français ou en Anglais<br><i>Astuce : Connecte-toi à Internet (pas le Wifi de l'école s'il bloque PubChem)</i></p>`;
}
</script>
</body>
</html>
