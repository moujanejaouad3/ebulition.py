<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ebulition - Infini Molécules</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:20px}
input{padding:15px;width:80%;max-width:400px;border-radius:10px;border:none;font-size:18px}
button{padding:15px 25px;background:#22c55e;color:white;border:none;border-radius:10px;font-size:18px;cursor:pointer;margin-top:10px}
.card{background:white;color:black;padding:20px;border-radius:15px;margin:20px auto;max-width:500px;text-align:left}
</style>
</head>
<body>
<h1>🔬 EbulitionPy - INFINI</h1>
<p>Cherche n'importe quelle molécule dans le monde !</p>
<input id="nom" placeholder="Ex: Caféine, Aspirine, Benzène...">
<br>
<button onclick="chercher()">Chercher 🔍</button>
<div id="resultat"></div>

<script>
async function chercher(){
  let nom = document.getElementById('nom').value;
  if(!nom) return alert('Kteb smiya !');
  document.getElementById('resultat').innerHTML = '⏳ Kan-9elleb...';
  try{
    let res = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${nom}/property/MolecularFormula,MolecularWeight,IUPACName,CanonicalSMILES/JSON`);
    let data = await res.json();
    let m = data.PropertyTable.Properties[0];
    document.getElementById('resultat').innerHTML = `
      <div class="card">
        <h2>✅ ${nom}</h2>
        <p><b>Formule :</b> ${m.MolecularFormula}</p>
        <p><b>Masse :</b> ${m.MolecularWeight} g/mol</p>
        <p><b>Nom IUPAC :</b> ${m.IUPACName}</p>
        <p><b>SMILES :</b> ${m.CanonicalSMILES}</p>
      </div>`;
  }catch(e){
    document.getElementById('resultat').innerHTML = '<p>❌ Molécule introuvable, jereb smiya akhra</p>';
  }
}
</script>
</body>
</html>
