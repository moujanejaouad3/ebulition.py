<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EbulitionPy - Infini ♾️</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:20px}
input{padding:15px;width:85%;max-width:450px;border-radius:10px;border:none;font-size:18px}
button{padding:15px 25px;background:#f59e0b;color:white;border:none;border-radius:10px;font-size:18px;cursor:pointer;margin-top:10px;font-weight:bold}
.card{background:white;color:black;padding:25px;border-radius:20px;margin:20px auto;max-width:500px;text-align:center}
.temp{font-size:32px;color:#dc2626;font-weight:bold;margin-top:10px}
.small{color:#666;font-size:13px}
.badge{background:#22c55e;color:white;padding:5px 12px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<h1>🌡️ EbulitionPy ♾️</h1>
<p><span class="badge">INFINI - 115 000 000+ Molécules</span></p>
<p>Écris N'IMPORTE QUELLE molécule !</p>
<input id="nom" placeholder="Ex: Eau, Paracétamol, Glucose, Caféine..." onkeydown="if(event.key==='Enter') chercher()">
<br>
<button onclick="chercher()">Chercher 🔍</button>
<div id="resultat"></div>

<script>
// TRADUCTION FR -> EN pour PubChem
const trad = {
  "eau":"water", "alcool":"ethanol", "vinaigre":"acetic acid",
  "sel":"sodium chloride", "sucre":"sucrose", "aspirine":"aspirin",
  "cafeine":"caffeine", "caféine":"caffeine", "acétone":"acetone",
  "ammoniaque":"ammonia", "benzène":"benzene", "méthane":"methane",
  "éthanol":"ethanol", "chloroforme":"chloroform", "oxygène":"oxygen",
  "azote":"nitrogen", "hydrogène":"hydrogen", "dioxyde de carbone":"carbon dioxide"
};

// BASE RAPIDE pour les 5 plus connues - pour que ça soit instantané
const rapide = {
  "eau":"100 °C", "water":"100 °C",
  "ethanol":"78.4 °C", "éthanol":"78.4 °C", "alcool":"78.4 °C",
  "acétone":"56 °C", "acetone":"56 °C",
  "benzène":"80.1 °C", "benzene":"80.1 °C"
};

function trouverTemp(o){
  if(!o) return null;
  if(o.TOCHeading && o.TOCHeading.toLowerCase().includes("boiling")){
    try{ return o.Information[0].Value.StringWithMarkup[0].String; }catch(e){ return null; }
  }
  if(o.Section){ for(let s of o.Section){ let r=trouverTemp(s); if(r) return r; } }
  return null;
}

async function chercher(){
  let nomOrig = document.getElementById('nom').value.trim();
  if(!nomOrig) return alert('Écris un nom !');
  let cle = nomOrig.toLowerCase();
  document.getElementById('resultat').innerHTML = '⏳ Je cherche dans 115 millions de molécules...';

  // 1. Rapide
  if(rapide[cle]){
    document.getElementById('resultat').innerHTML = `<div class="card"><h2>✅ ${nomOrig}</h2><p>La température d'ébullition est de :</p><div class="temp">🌡️ ${rapide[cle]}</div><p class="small">Source : EbulitionPy ♾️</p></div>`;
    return;
  }

  // 2. INFINI - PubChem
  let nom = trad[cle] || nomOrig;
  try{
    let res = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${encodeURIComponent(nom)}/property/CID,CanonicalSMILES/JSON`);
    if(!res.ok) throw new Error('no');
    let data = await res.json();
    let cid = data.PropertyTable.Properties[0].CID;

    let res2 = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug_view/data/compound/${cid}/JSON?heading=Experimental+Properties`);
    let data2 = await res2.json();
    let t = trouverTemp(data2.Record);

    if(!t){
      // Si pas de point d'ébullition, on essaie le point de fusion / décomposition
      t = "Pas de point d'ébullition - Cette molécule se décompose avant de bouillir";
    }

    document.getElementById('resultat').innerHTML = `
      <div class="card">
        <h2>✅ ${nomOrig}</h2>
        <p>La température d'ébullition est de :</p>
        <div class="temp">🌡️ ${t}</div>
        <p class="small">Source : PubChem ♾️ - Molécule N° ${cid} / 115 000 000+</p>
      </div>`;
  }catch(e){
    document.getElementById('resultat').innerHTML = `<p>❌ Molécule introuvable.<br>Essaie en anglais : Water, Ethanol, Glucose, Caffeine<br>Ou vérifie l'orthographe</p>`;
  }
}
</script>
</body>
</html>
