<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EbulitionPy - Température</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:20px}
input{padding:15px;width:80%;max-width:400px;border-radius:10px;border:none;font-size:18px}
button{padding:15px 25px;background:#f59e0b;color:white;border:none;border-radius:10px;font-size:18px;cursor:pointer;margin-top:10px;font-weight:bold}
.card{background:white;color:black;padding:25px;border-radius:20px;margin:20px auto;max-width:450px;text-align:center}
.temp{font-size:32px;color:#dc2626;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<h1>🌡️ EbulitionPy</h1>
<p>Kteb smiya dyal molécule, n-3tik ghir la température dyalha !</p>
<input id="nom" placeholder="Ex: Aspirine, Eau, Caféine...">
<br>
<button onclick="chercher()">Chercher 🔍</button>
<div id="resultat"></div>

<script>
async function chercher(){
  let nom = document.getElementById('nom').value;
  if(!nom) return alert('Kteb smiya !');
  document.getElementById('resultat').innerHTML = '⏳ Kan-9elleb...';
  try{
    let res = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${nom}/property/CID/JSON`);
    let data = await res.json();
    let cid = data.PropertyTable.Properties[0].CID;

    let tempText = "Température non disponible";
    let res2 = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug_view/data/compound/${cid}/JSON?heading=Experimental+Properties`);
    let data2 = await res2.json();
    let sections = data2.Record.Section[0].Section;
    for(let s of sections){
      if(s.TOCHeading && s.TOCHeading.includes("Boiling Point")){
        tempText = s.Information[0].Value.StringWithMarkup[0].String;
        break;
      }
    }

    document.getElementById('resultat').innerHTML = `
      <div class="card">
        <h2>✅ ${nom}</h2>
        <p>La température d'ébullition est de :</p>
        <div class="temp">🌡️ ${tempText}</div>
      </div>`;
  }catch(e){
    document.getElementById('resultat').innerHTML = '<p>❌ Molécule introuvable, jereb smiya akhra</p>';
  }
}
</script>
</body>
</html>
