<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EbulitionPy - Resultat Live ♾️</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:20px}
input{padding:15px;width:85%;max-width:520px;border-radius:10px;border:none;font-size:18px}
button{padding:15px 25px;background:#f59e0b;color:white;border:none;border-radius:10px;font-size:18px;cursor:pointer;margin-top:10px;font-weight:bold}
.card{background:white;color:black;padding:25px;border-radius:20px;margin:20px auto;max-width:560px;text-align:center}
.temp{font-size:32px;color:#dc2626;font-weight:bold;margin-top:10px}
.small{color:#666;font-size:13px}
.badge{background:#22c55e;color:white;padding:5px 12px;border-radius:20px;font-size:12px}
.ex{margin-top:20px;font-size:13px;color:#cbd5e1}
.ex span{background:#1e293b;padding:6px 11px;border-radius:20px;margin:3px;display:inline-block;cursor:pointer}
</style>
</head>
<body>
<h1>🌡️ EbulitionPy ♾️</h1>
<p><span class="badge">Valeurs LIVE - Pas dans le code</span></p>
<p><b>Écris N'IMPORTE QUELLE molécule !</b></p>
<input id="nom" placeholder="Ex: Propane, Menthol, Eau, Benzene..." onkeydown="if(event.key==='Enter') chercher()">
<br><button onclick="chercher()">Chercher 🔍</button>
<div id="resultat"></div>
<div class="ex">
Teste :<br>
<span onclick="tester('Propane')">Propane</span>
<span onclick="tester('Menthol')">Menthol</span>
<span onclick="tester('Eau')">Eau</span>
<span onclick="tester('Benzene')">Benzene</span>
<span onclick="tester('Amoxicilline')">Amoxicilline</span>
<span onclick="tester('Acide phosphorique')">Acide phosphorique</span>
</div>
<script>
function tester(n){ document.getElementById('nom').value=n; chercher(); }

// --- 1. WIKIDATA : Kay-khdem dima, CORS me7loul ---
async function chercherWikidata(nom){
  try{
    let r = await fetch(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(nom)}&language=en&format=json&origin=*`);
    let j = await r.json();
    if(!j.search || !j.search.length) return null;
    let id = j.search[0].id;
    let r2 = await fetch(`https://www.wikidata.org/wiki/Special:EntityData/${id}.json`);
    let j2 = await r2.json();
    let ent = j2.entities[id];
    // P2102 = Boiling point, P2101 = Melting point
    let claims = ent.claims && ent.claims.P2102;
    if(!claims) return null;
    let amount = parseFloat(claims[0].mainsnak.datavalue.value.amount);
    let unit = claims[0].mainsnak.datavalue.value.unit;
    // Wikidata kay-3ti b Kelvin, n-7ewlo l Celsius
    let celsius;
    if(unit.includes("Kelvin") || Math.abs(amount) > 200) celsius = amount - 273.15;
    else celsius = amount;
    return { temp: celsius.toFixed(1) + " °C", source: "Wikidata LIVE - " + id };
  }catch(e){ return null; }
}

// --- 2. PUBCHEM via 3 PROXY ---
function trouverTemp(o){
  if(!o) return null;
  if(typeof o==='string'){ let m=o.match(/-?\d+(\.\d+)?\s?°C/); return m?m[0]:null; }
  if(Array.isArray(o)){ for(let v of o){ let r=trouverTemp(v); if(r) return r; } return null; }
  if(typeof o==='object'){
    if(o.TOCHeading && o.TOCHeading.toLowerCase().includes("boiling")){ try{ return o.Information[0].Value.StringWithMarkup[0].String; }catch(e){} let r=trouverTemp(o.Information); if(r) return r; }
    for(let k in o){ if(k==="TOCHeading") continue; let r=trouverTemp(o[k]); if(r) return r; }
  }
  return null;
}
async function fetchJSON(url){
  let proxies = [
    url,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
  ];
  for(let p of proxies){
    try{
      let ctrl = new AbortController();
      let to = setTimeout(()=>ctrl.abort(), 6000);
      let r = await fetch(p, {signal: ctrl.signal});
      clearTimeout(to);
      if(!r.ok) continue;
      let t = await r.text();
      // allorigins/get kay-rje3 {contents:"..."}
      if(t.includes('"contents"')){ try{ let jj=JSON.parse(t); t=jj.contents; }catch(e){} }
      if(t.trim().startsWith("{")) return JSON.parse(t);
    }catch(e){ continue; }
  }
  return null;
}
async function chercherPubChem(nom){
  let d1 = await fetchJSON(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${encodeURIComponent(nom)}/property/CID/JSON`);
  if(!d1 || !d1.PropertyTable) return null;
  let cid = d1.PropertyTable.Properties[0].CID;
  let d2 = await fetchJSON(`https://pubchem.ncbi.nlm.nih.gov/rest/pug_view/data/compound/${cid}/JSON?heading=Boiling+Point`);
  if(!d2) return null;
  let temp = trouverTemp(d2.Record);
  if(temp) return {temp:temp, source:"PubChem LIVE - N° "+cid};
  return {temp:"Pas de point d'ébullition - Elle se décompose avant de bouillir", source:"PubChem LIVE - N° "+cid};
}

async function chercher(){
  let nomOrig = document.getElementById('nom').value.trim();
  if(!nomOrig) return alert('Écris un nom !');
  document.getElementById('resultat').innerHTML = '⏳ Je cherche la valeur LIVE...';

  // Jereb Wikidata l-ewwel - hiya li sri3a w kat-khdem dima
  let r1 = await chercherWikidata(nomOrig);
  if(r1){
    document.getElementById('resultat').innerHTML = `<div class="card"><h2>✅ ${nomOrig}</h2><p>La température d'ébullition est de :</p><div class="temp">🌡️ ${r1.temp}</div><p class="small">Source : ${r1.source}<br>La valeur vient du RESULTAT, pas du code !</p></div>`;
    return;
  }
  // Ila ma-l9ach, jereb PubChem
  let r2 = await chercherPubChem(nomOrig);
  if(r2){
    document.getElementById('resultat').innerHTML = `<div class="card"><h2>✅ ${nomOrig}</h2><p>La température d'ébullition est de :</p><div class="temp">🌡️ ${r2.temp}</div><p class="small">Source : ${r2.source}<br>La valeur vient du RESULTAT, pas du code !</p></div>`;
    return;
  }
  document.getElementById('resultat').innerHTML = `<p>❌ Molécule introuvable.<br>Essaie : Propane, Eau, Benzene, Menthol</p>`;
}
</script>
</body>
</html>
